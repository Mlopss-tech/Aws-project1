name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Linting
      - name: Run linting
        run: |
          flake8 src scripts

      # # 5. Unit tests
      # - name: Run pytest
      #   run: |
      #     pytest -v tests

      # 6. Verify FastAPI application
      - name: Verify FastAPI application
        run: |
          python -c "from src.app.app import app; print('FastAPI application loaded successfully')"